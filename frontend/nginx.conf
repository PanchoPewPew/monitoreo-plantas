server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolver DNS para que nginx resuelva hostnames dinámicamente
    # en vez de cachear IPs al inicio (necesario para proxies HTTPS externos)
    resolver 8.8.8.8 8.8.4.4 valid=30s;
    resolver_timeout 5s;

    # Manejo de rutas SPA (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso al backend.
    # BACKEND_URL se reemplaza en tiempo de build via ARG en el Dockerfile.
    location /api/ {
        set $backend BACKEND_PLACEHOLDER;
        proxy_pass         $backend/api/;
        proxy_set_header   Host              monitoreo-is5b.onrender.com;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
        proxy_ssl_verify   off;
    }

    # Health check del backend
    location = /backend-health {
        set $backend BACKEND_PLACEHOLDER;
        proxy_pass         $backend/;
        proxy_set_header   Host              monitoreo-is5b.onrender.com;
        proxy_ssl_server_name on;
        proxy_ssl_verify   off;
    }
}
